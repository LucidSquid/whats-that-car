<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Make & Model Identifier</title>
    <link rel="icon" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Leckerli+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Global browser script (no type="module") -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.26.0/dist/ort.min.js"></script>
    <!-- ES module script -->
    <script type="module" src="script.js"></script>
</head>
<body>
    <h1>What's That <span>Car?</span></h1>
    <p>Upload an image of a car or truck from 1950-2016 to detect its make and model.</p>
    <div class="main-content">
        <div class="drop-input">
            <!-- Default state -->
            <div id="default-state">
                <div class="drop-icon-wrap">
                    <svg class="drop-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 20l6-6 6 6"></path>
                        <path d="M16 14v12"></path>
                        <rect x="4" y="6" width="24" height="20" rx="3"></rect>
                        <circle cx="22" cy="12" r="2"></circle>
                    </svg>
                </div>
                <div>Drop or paste your image here</div>
                <p>Drag & drop, paste, or click to browse an image from your files.</p>
            </div>
            <!-- Preview state -->
            <div id="preview-state">
                <img id="preview-image" src="" alt="Uploaded Image Preview">
            </div>
        </div>

        <div id="result-spinner">
            <div class="spinner"></div>
        </div>
        <div id="results">
            <div class="result">
                <div class="make title">Make</div>
                <div class="make value" id="make-value">Toyota</div>
            </div>
            <div class="result">
                <div class="make title">Model</div>
                <div class="make value" id="model-value">Corolla</div>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" accept="image/*">
</body>
</html>
